name: Build and publish the OCI image.
on:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - ".github/workflows/build-image.yaml"
  pull_request:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "main.go"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse versions from go.mod
        id: parse_version
        run: |
          if [ ! -f go.mod ]; then
            echo "Error: go.mod file not found!"
            exit 1
          fi

          GOMOD_JSON="$(go mod edit -json)"
          CADDY_RAW=$(jq -r '.Require[] | select(.Path == "github.com/caddyserver/caddy/v2") | .Version' <<< "$GOMOD_JSON")
          CF_RAW=$(jq -r '.Require[] | select(.Path == "github.com/caddy-dns/cloudflare") | .Version' <<< "$GOMOD_JSON")
          OIDC_RAW=$(jq -r '.Require[] | select(.Path == "github.com/relvacode/caddy-oidc") | .Version' <<< "$GOMOD_JSON")

          # Strip leading 'v'
          CADDY_VER="${CADDY_RAW#v}"
          CF_VER="${CF_RAW#v}"
          OIDC_VER="${OIDC_RAW#v}"

          if [ -z "$CADDY_VER" ]; then
            echo "Error: Could not parse Caddy version from go.mod"
            exit 1
          fi

          MAJOR=$(echo "$CADDY_VER" | cut -d'.' -f1)
          MINOR=$(echo "$CADDY_VER" | cut -d'.' -f1,2)

          #  RFC 3339 timestamp for org.opencontainers.image.created
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "version=${CADDY_VER}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT
          echo "cf_version=${CF_VER}" >> $GITHUB_OUTPUT
          echo "oidc_version=${OIDC_VER}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
      - name: Downcase Repository Name
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push to registry ONLY on pushes to main.
      # On PRs (including Dependabot PRs), we only test-compile to ensure the plugin builds successfully.
      - name: Build and Push Custom Caddy Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=9,force-compression=true
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo }}:latest
            ghcr.io/${{ steps.prep.outputs.repo }}:${{ steps.parse_version.outputs.major }}
            ghcr.io/${{ steps.prep.outputs.repo }}:${{ steps.parse_version.outputs.minor }}
            ghcr.io/${{ steps.prep.outputs.repo }}:${{ steps.parse_version.outputs.version }}
          annotations: |
            org.opencontainers.image.version=${{ steps.parse_version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.parse_version.outputs.build_date }}
            sh.caddy.plugin.cloudflare=${{ steps.parse_version.outputs.cf_version }}
            sh.caddy.plugin.oidc=${{ steps.parse_version.outputs.oidc_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
