name: Build and publish the OCI image.
on:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - ".github/workflows/build-image.yaml"
  pull_request:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "main.go"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse versions from go.mod
        id: parse_version
        run: |
          if [ ! -f go.mod ]; then
            echo "Error: go.mod file not found!"
            exit 1
          fi

          GOMOD_JSON="$(go mod edit -json)"
          CADDY_RAW=$(jq -r '.Require[] | select(.Path == "github.com/caddyserver/caddy/v2") | .Version' <<< "$GOMOD_JSON")
          CF_RAW=$(jq -r '.Require[] | select(.Path == "github.com/caddy-dns/cloudflare") | .Version' <<< "$GOMOD_JSON")
          OIDC_RAW=$(jq -r '.Require[] | select(.Path == "github.com/relvacode/caddy-oidc") | .Version' <<< "$GOMOD_JSON")

          # Strip leading 'v'
          CADDY_VER="${CADDY_RAW#v}"
          CF_VER="${CF_RAW#v}"
          OIDC_VER="${OIDC_RAW#v}"

          if [ -z "$CADDY_VER" ]; then
            echo "Error: Could not parse Caddy version from go.mod"
            exit 1
          fi

          MAJOR=$(echo "$CADDY_VER" | cut -d'.' -f1)
          MINOR=$(echo "$CADDY_VER" | cut -d'.' -f1,2)

          #  RFC 3339 timestamp for org.opencontainers.image.created
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "version=${CADDY_VER}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT
          echo "cf_version=${CF_VER}" >> $GITHUB_OUTPUT
          echo "oidc_version=${OIDC_VER}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Downcase Repository Name
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u ${{ github.actor }} --password-stdin ghcr.io

      - name: Build Caddy Image
        run: |
          buildah bud \
            --format oci \
            --label "org.opencontainers.image.title=Caddy Custom Build" \
            --label "org.opencontainers.image.description=Statically compiled Caddy server with Cloudflare DNS and OIDC plugins" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.version=${{ steps.parse_version.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=${{ steps.parse_version.outputs.build_date }}" \
            --label "sh.caddy.plugin.cloudflare=${{ steps.parse_version.outputs.cf_version }}" \
            --label "sh.caddy.plugin.oidc=${{ steps.parse_version.outputs.oidc_version }}" \
            -t caddy-local .

      # Pushes ONLY on pushes to master. On PRs, the "Build" step above acts as the validation.
      - name: Push to GHCR with zstd:chunked compression
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          TAGS=(
            "latest"
            "${{ steps.parse_version.outputs.major }}"
            "${{ steps.parse_version.outputs.minor }}"
            "${{ steps.parse_version.outputs.version }}"
          )

          for TAG in "${TAGS[@]}"; do
            echo "Pushing tag: ${TAG}"
            buildah push \
              --compression-format=zstd:chunked \
              caddy-local \
              "docker://ghcr.io/${{ steps.prep.outputs.repo }}:${TAG}"
          done
